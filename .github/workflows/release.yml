name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Verify tag matches package version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "$expected"
      - name: Build release ZIP
        run: |
          mkdir -p dist/paldefender-discord-bot
          rsync -a ./ dist/paldefender-discord-bot/ \
            --exclude .git \
            --exclude .github \
            --exclude dist \
            --exclude node_modules \
            --exclude .env \
            --exclude logs
          cd dist
          zip -r "paldefender-discord-bot-${GITHUB_REF_NAME}.zip" paldefender-discord-bot
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/paldefender-discord-bot-${GITHUB_REF_NAME}.zip" --generate-notes --verify-tag
