name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Verify tag matches package version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "$expected"
      - name: Build release ZIP
        run: |
          mkdir -p dist/paldefender-discord-bot
          rsync -a ./ dist/paldefender-discord-bot/ \
            --exclude .git \
            --exclude .github \
            --exclude dist \
            --exclude node_modules \
            --exclude .env \
            --exclude logs
          cd dist
          zip -r "paldefender-discord-bot-${GITHUB_REF_NAME}.zip" paldefender-discord-bot
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/paldefender-discord-bot-${GITHUB_REF_NAME}.zip" --generate-notes --verify-tag
